<text class="tn" text-anchor="start" x="186.0" y="268.0">Dispersionsmodell (Paper)</text>
<line x1="168.0" y1="278.0" x2="182.0" y2="278.0" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="tn" text-anchor="start" x="186.0" y="281.0">Ersatz in StoSiS</text>
<text class="tl" text-anchor="start" x="320.0" y="262.0">E(t) = 1/τ · √(Pe / (4π θ)) · exp(−Pe (1 − θ)² / (4θ)),  θ = t/τ</text>
<text class="tn" text-anchor="start" x="320.0" y="280.0">E(t): Anteil des Pulvers, der nach der Zeit t den Mischer</text>
<text class="tn" text-anchor="start" x="320.0" y="291.0">verlässt, je Sekunde (Verweilzeitverteilung).</text>
<text class="tn" text-anchor="start" x="320.0" y="305.0">Pe: Péclet-Zahl, Transport mit dem Strom gegen Rückvermischung;</text>
<text class="tn" text-anchor="start" x="320.0" y="316.0">klein = stark rückvermischt. Im Paper an die Pulsmessung</text>
<text class="tn" text-anchor="start" x="320.0" y="327.0">angepasst: Pe = 1,76, τ = 3,66 s.</text>
<text class="tn" text-anchor="start" x="320.0" y="341.0">τ ist nur der Zeitmaßstab: mittlere Verweilzeit τ (1 + 2/Pe) = 7,82 s,</text>
<text class="tn" text-anchor="start" x="320.0" y="352.0">Standardabweichung τ √(2/Pe + 8/Pe²) = 7,06 s.</text>
<text class="tn" text-anchor="start" x="320.0" y="366.0">StoSiS hat kein Dispersionsmodell. Ersatz (eigene Wahl, nicht</text>
<text class="tn" text-anchor="start" x="320.0" y="377.0">aus dem Paper): Pfropfen 0,76 s + Kessel 7,06 s, gleiches Mittel</text>
<text class="tn" text-anchor="start" x="320.0" y="388.0">und gleiche Standardabweichung.</text>
<text class="th2" text-anchor="start" x="10.0" y="420.0">c) In StoSiS (Gao2011_B4_Mischer.json)</text>
