<text class="tn" text-anchor="start" x="12.0" y="518.0">Zulauf: die im Paper gemessenen Dosierströme von 150 bis 300 s (abgelesen, alle 0,5 s; davor gleichbleibend), Hilfsstoff 64,2 kg/h, Wirkstoff 2,0 kg/h.</text>
<text class="tn" text-anchor="start" x="12.0" y="530.0">Kessel = Behälter ideal durchmischt, Pfropfen = Behälter Pfropfenströmung; Dauerbetrieb von Anfang an; Δt = 0,1 s (wie die Waage im Paper).</text>
<text class="tn" text-anchor="start" x="12.0" y="542.0">Cellets (mikrokristalline Cellulose) für den Hilfsstoff Avicel PH200, Urea als Platzhalter für den Wirkstoff Paracetamol.</text>
<text class="tn" text-anchor="start" x="12.0" y="562.0">Geprüft: StoSiS gegen die exakte Lösung des Ersatzes, der Ersatz gegen das Dispersionsmodell und der Ausgang gegen das Paper.</text>
<text class="ta" text-anchor="start" x="10.0" y="596.0">Quelle: Gao, Muzzio &amp; Ierapetritou (2011), AIChE J. 57, 1144–1153; Dosierströme aus Abb. 4b/c abgelesen, eigene Darstellung</text>
