<text class="ta" text-anchor="start" x="410.0" y="181.0">Proben alle 4 s → NIR-Analyse</text>
<text class="tu" text-anchor="start" x="470.0" y="60.0">Was gemessen ist</text>
<text class="tn" text-anchor="start" x="470.0" y="74.0">• Dosierstrom je Stoff (Waage)</text>
<text class="tn" text-anchor="start" x="470.0" y="86.0">• Verweilzeitverteilung: 10 g Wirkstoff</text>
<text class="tn" text-anchor="start" x="478.0" y="98.0">als Puls, Proben am Ausgang</text>
<text class="tu" text-anchor="start" x="470.0" y="114.0">Was gerechnet ist</text>
<text class="tn" text-anchor="start" x="470.0" y="128.0">• Ausgangsstrom = Dosierstrom gefaltet</text>
<text class="tn" text-anchor="start" x="478.0" y="140.0">mit der Verweilzeitverteilung</text>
<text class="tn" text-anchor="start" x="470.0" y="152.0">• Streuung und VRR (Tab. 1 im Paper)</text>
<text class="ta" text-anchor="start" x="10.0" y="204.0">Nach Gao, Muzzio &amp; Ierapetritou (2011), AIChE J. 57, 1144–1153; eigene Darstellung. Blaue Linien: Pulverweg.</text>
<text class="th2" text-anchor="start" x="10.0" y="232.0">b) Im Paper: Mischer als Dispersionsmodell; in StoSiS: Ersatz mit gleichem Mittel und gleicher Streuung</text>
