<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250">
<title>Systematisch verteilen mit einem Konto</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="24">Systematisch verteilen mit einem Konto: f = 27 %, 15 Karten eines Zeitschritts</text>
<text class="ts" x="40" y="44">Jede Karte zahlt 0,27 auf das A-Konto ein. Ab 0,5 geht die Karte ganz nach A, das Konto wird um 1 belastet.</text>
<g class="c-teal"><rect x="40" y="70" width="36" height="36" rx="4" stroke-width="0.8"/></g><text class="th" x="58" y="62" text-anchor="middle">A</text><circle cx="58" cy="88" r="3.0" fill="#7F77DD"/><text class="ts" x="58" y="124" text-anchor="middle">0,57</text>
<rect class="box" x="81" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="99" cy="88" r="3.7" fill="#7F77DD"/><text class="ts" x="99" y="124" text-anchor="middle">−0,16</text>
<rect class="box" x="122" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="140" cy="88" r="4.4" fill="#7F77DD"/><text class="ts" x="140" y="124" text-anchor="middle">0,11</text>
<rect class="box" x="163" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="181" cy="88" r="5.1" fill="#7F77DD"/><text class="ts" x="181" y="124" text-anchor="middle">0,38</text>
<g class="c-teal"><rect x="204" y="70" width="36" height="36" rx="4" stroke-width="0.8"/></g><text class="th" x="222" y="62" text-anchor="middle">A</text><circle cx="222" cy="88" r="5.8" fill="#7F77DD"/><text class="ts" x="222" y="124" text-anchor="middle">0,65</text>
<rect class="box" x="245" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="263" cy="88" r="6.5" fill="#7F77DD"/><text class="ts" x="263" y="124" text-anchor="middle">−0,08</text>
<rect class="box" x="286" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="304" cy="88" r="7.2" fill="#7F77DD"/><text class="ts" x="304" y="124" text-anchor="middle">0,19</text>
<rect class="box" x="327" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="345" cy="88" r="7.9" fill="#7F77DD"/><text class="ts" x="345" y="124" text-anchor="middle">0,46</text>
<g class="c-teal"><rect x="368" y="70" width="36" height="36" rx="4" stroke-width="0.8"/></g><text class="th" x="386" y="62" text-anchor="middle">A</text><circle cx="386" cy="88" r="8.6" fill="#7F77DD"/><text class="ts" x="386" y="124" text-anchor="middle">0,73</text>
<rect class="box" x="409" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="427" cy="88" r="9.3" fill="#7F77DD"/><text class="ts" x="427" y="124" text-anchor="middle">0,00</text>
<rect class="box" x="450" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="468" cy="88" r="10.0" fill="#7F77DD"/><text class="ts" x="468" y="124" text-anchor="middle">0,27</text>
<g class="c-teal"><rect x="491" y="70" width="36" height="36" rx="4" stroke-width="0.8"/></g><text class="th" x="509" y="62" text-anchor="middle">A</text><circle cx="509" cy="88" r="10.7" fill="#7F77DD"/><text class="ts" x="509" y="124" text-anchor="middle">0,54</text>
<rect class="box" x="532" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="550" cy="88" r="11.4" fill="#7F77DD"/><text class="ts" x="550" y="124" text-anchor="middle">−0,19</text>
<rect class="box" x="573" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="591" cy="88" r="12.1" fill="#7F77DD"/><text class="ts" x="591" y="124" text-anchor="middle">0,08</text>
<rect class="box" x="614" y="70" width="36" height="36" rx="4" stroke-width="0.5"/><circle cx="632" cy="88" r="12.8" fill="#7F77DD"/><text class="ts" x="632" y="124" text-anchor="middle">0,35</text>
<text class="ts" x="40" y="150">Zahlen: Kontostand nach der Einzahlung (Start 0,30) · grün = Karte geht ganz nach A · Karten der Größe nach sortiert</text>
<text class="t" x="40" y="180">Ergebnis: 4 von 15 Karten nach A (26,7 %, Ziel 4,05) – Rest 0,35 bleibt für den nächsten Schritt.</text>
<text class="t" x="40" y="206">Über 100 Schritte mit je 200 Karten: A bekommt 5 400 von 20 000 Karten, genau bis auf eine Karte.</text>
<text class="t" x="40" y="232">Zufall nur beim Start: Anfangswert des Kontos (einmal) und Startposition in der sortierten Liste (je Schritt).</text>
