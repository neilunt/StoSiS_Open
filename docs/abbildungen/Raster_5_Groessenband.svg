<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362">
<title>Groessenband</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="24">② Das ganze Größenband: vom Atom bis zum Agglomerat (logarithmische Achse)</text>
<line x1="40" y1="170" x2="640" y2="170" stroke="#5F5E5A" stroke-width="1"/>
<line x1="40.0" y1="170" x2="40.0" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="40.0" y="188" text-anchor="middle">0,1 nm</text>
<line x1="94.5" y1="170" x2="94.5" y2="176" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="94.5" y="188" text-anchor="middle" font-weight="bold">1 nm</text>
<line x1="149.1" y1="170" x2="149.1" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="149.1" y="188" text-anchor="middle">10 nm</text>
<line x1="203.6" y1="170" x2="203.6" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="203.6" y="188" text-anchor="middle">100 nm</text>
<line x1="258.2" y1="170" x2="258.2" y2="176" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="258.2" y="188" text-anchor="middle" font-weight="bold">1 µm</text>
<line x1="312.7" y1="170" x2="312.7" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="312.7" y="188" text-anchor="middle">10 µm</text>
<line x1="367.3" y1="170" x2="367.3" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="367.3" y="188" text-anchor="middle">100 µm</text>
<line x1="421.8" y1="170" x2="421.8" y2="176" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="421.8" y="188" text-anchor="middle" font-weight="bold">1 mm</text>
<line x1="476.4" y1="170" x2="476.4" y2="174" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="476.4" y="188" text-anchor="middle">10 mm</text>
<g class="c-gray"><rect x="61.7" y="56" width="11.1" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="67.3" y="50" text-anchor="middle">Atom</text>
<g class="c-red"><rect x="72.8" y="96" width="49.3" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="97.5" y="90" text-anchor="middle">kritischer Keim</text>
<g class="c-teal"><rect x="132.7" y="56" width="97.0" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="181.2" y="50" text-anchor="middle">Nanopartikel aus der Gasphase</text>
<g class="c-amber"><rect x="350.9" y="96" width="32.8" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="367.3" y="90" text-anchor="middle">Sand-Inlet</text>
<g class="c-purple"><rect x="383.7" y="56" width="64.2" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="415.8" y="50" text-anchor="middle">Agglomerate</text>
<path d="M367.3 126 Q 394.6 104 421.8 126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="394.6" y="146" text-anchor="middle">1000 Partikel → 10 × d</text>
<text class="t" x="258.2" y="219">Standard: 1 µm – 1 mm · 3 Dekaden = 300 Klassen</text><g class="c-amber"><rect x="258.2" y="225" width="163.6" height="12" rx="4" stroke-width="0.5"/></g>
<text class="t" x="94.5" y="261">mit Keimbildung: 1 nm – 1 mm · 6 Dekaden = 600 Klassen</text><g class="c-purple"><rect x="94.5" y="267" width="327.3" height="12" rx="4" stroke-width="0.5"/></g>
<text class="t" x="66.0" y="303">Nanopartikelsynthese: 0,3 nm – 10 µm · 4,5 Dekaden = 450 Klassen</text><g class="c-teal"><rect x="66.0" y="309" width="246.7" height="12" rx="4" stroke-width="0.5"/></g>
<text class="ts" x="20" y="350">Klassenzahl bei 100 Klassen je Dekade. Jede Dekade mehr kostet 100 Klassen; Speicher und Rechenzeit wachsen nur linear.</text>
</svg>
