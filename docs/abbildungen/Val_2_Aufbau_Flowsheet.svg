<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690">
<title>Versuchsaufbau und Flowsheet</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<view id="teil1" viewBox="0 52 680 265"/>
<view id="teil2" viewBox="0 317 680 185"/>
<view id="teil3" viewBox="0 502 680 188"/>
<text class="th" x="20" y="24">Dosierwaagen-Versuch (Engisch &amp; Muzzio 2012) und das StoSiS-Flowsheet, das ihn nachbildet</text>
<text class="ts" x="20" y="42">Gleiche Farbe = gleiche Aufgabe: Grün liefert und schwankt, Lila misst, Orange wertet aus, Grau ist nicht nachgebildet.</text>
<text class="th" x="20" y="70">② Versuchsaufbau im Paper (nach Abb. 1 und 4 dort, vereinfacht)</text>
<polygon points="95,85 215,85 180,140 130,140" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="155" y="108" text-anchor="middle" style="fill:#444441">Vorrats-</text><text class="ts" x="155" y="122" text-anchor="middle" style="fill:#444441">trichter</text>
<rect x="105" y="140" width="100" height="38" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="55" y="150" width="50" height="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<polyline points="60,159 65,153 75,165 85,153 95,165 105,153 115,165 125,153 135,165 145,153 155,165 165,153 175,165 185,153 195,165 200,159" fill="none" stroke="#0F6E56" stroke-width="1"/>
<rect x="205" y="147" width="28" height="24" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><text class="ts" x="219" y="163" text-anchor="middle" style="fill:#085041">M</text>
<rect x="105" y="180" width="100" height="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="155" y="189.5" text-anchor="middle" style="font-size:9.5px;fill:#444441">Wägezelle</text>
<rect x="90" y="193" width="160" height="5" fill="#B4B2A9"/>
<text class="ts" x="155" y="212" text-anchor="middle">Doppelschnecke mit Rührer</text>
<path d="M57,168 C40,182 58,205 60,226" fill="none" stroke="#854F0B" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
<text class="ts" x="8" y="200">Pulver</text>
<rect x="40" y="230" width="42" height="32" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="28" y="263" width="66" height="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="57" y="269" width="8" height="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="22" y="279" width="78" height="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="t" x="96" y="242" style="fill:#3C3489">Auffangwaage mit Eimer</text>
<text class="ts" x="96" y="257">Gewicht alle 0,1 s, unabhängig vom Regler</text>
<line x1="100" y1="283" x2="213" y2="283" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="215" y="266" width="140" height="36" rx="4" stroke-width="0.8"/><text class="t" x="285" y="281" text-anchor="middle">PC-Auswertung</text><text class="ts" x="285" y="296" text-anchor="middle">1-s-Werte, Filter, RSD</text></g>
<g class="c-gray"><rect x="275" y="92" width="140" height="100" rx="4" stroke-width="0.8"/></g>
<text class="th" x="345" y="110" text-anchor="middle" style="fill:#444441">Regler</text>
<text class="ts" x="345" y="128" text-anchor="middle">Sollwert 70 kg/h</text>
<text class="ts" x="345" y="146" text-anchor="middle">vergleicht mit dem</text>
<text class="ts" x="345" y="161" text-anchor="middle">Gewichtsverlust und</text>
<text class="ts" x="345" y="176" text-anchor="middle">stellt die Drehzahl nach</text>
<polyline points="205,186 258,186 258,172 273,172" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<polyline points="275,118 219,118 219,145" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="226" y="112" style="fill:#791F1F">Drehzahl</text>
<text class="ts" x="214" y="181" style="fill:#791F1F;font-size:10.5px">Ist</text>
<text class="ts" x="432" y="104">Laktose, Sollwert 70 kg/h, Dosierer K-Tron KT35</text>
<text class="ts" x="432" y="124">• Wägezelle und Regler halten das Mittel</text>
<text class="ts" x="432" y="142">• Es bleibt eine Restschwankung</text>
<text class="ts" x="442" y="157">(Schnecken, Rührer, Pulverfluss).</text>
<text class="ts" x="432" y="175">• Die Auffangwaage misst unabhängig,</text>
<text class="ts" x="442" y="190">alle 0,1 s, über mehr als 30 min.</text>
<text class="ts" x="432" y="208">• Eimerwechsel und Nachfüllen werden</text>
<text class="ts" x="442" y="223">später herausgefiltert.</text>

<text class="th" x="20" y="335">③ StoSiS-Flowsheet, das den Versuch nachbildet</text>
<g class="c-teal"><rect x="30" y="355" width="125" height="50" rx="6" stroke-width="0.8"/><text class="t" x="92.5" y="376" text-anchor="middle">Inlet „Dosierer“</text><text class="ts" x="92.5" y="394" text-anchor="middle">100 kg/h, konstant</text></g>
<line x1="155" y1="380" x2="198" y2="380" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="345" width="165" height="70" rx="6" stroke-width="0.8"/><text class="t" x="282.5" y="366" text-anchor="middle">Splitter „Schwankung“</text><text class="ts" x="282.5" y="384" text-anchor="middle">Ausgang 1: Anteil μ = 0,6944</text><text class="ts" x="282.5" y="401" text-anchor="middle">OU: σ = 0,81 kg/h, τ = 0,3 s</text></g>
<line x1="365" y1="364" x2="403" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="365" y1="400" x2="403" y2="413" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="405" y="338" width="140" height="48" rx="6" stroke-width="0.8"/><text class="ts" x="475" y="353" text-anchor="middle">Outlet</text><text class="t" x="475" y="369" text-anchor="middle">„Auffangwaage“</text><text class="ts" x="475" y="382" text-anchor="middle">≈ 69,4 kg/h ± Schwankung</text></g>
<g class="c-gray"><rect x="405" y="396" width="140" height="36" rx="6" stroke-width="0.8"/><text class="t" x="475" y="411" text-anchor="middle">Outlet „Rest“</text><text class="ts" x="475" y="425" text-anchor="middle">≈ 30,6 kg/h</text></g>
<line x1="545" y1="362" x2="573" y2="362" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="575" y="338" width="92" height="48" rx="6" stroke-width="0.8"/><text class="t" x="621" y="358" text-anchor="middle">Auswertung</text><text class="ts" x="621" y="374" text-anchor="middle">wie im Paper</text></g>
<text class="ts" x="30" y="452">Zeitschritt dt = 0,1 s wie die Auffangwaage, 30 min; ein gezeigter Lauf und 20 weitere Läufe (tests/analysis_dosierwaage.cpp).</text>
<text class="ts" x="30" y="470">Warum ein Splitter? In StoSiS schwankt nur der Splitter (OU-Prozess). Vor einem Outlet macht er aus dem</text>
<text class="ts" x="30" y="485">konstanten Zulauf einen schwankenden Strom – wie die Dosierwaage. Der Rest-Ausgang dient nur der Massenbilanz.</text>

<text class="th" x="20" y="520">④ Was entspricht was?</text>
<text class="ts" x="45" y="540" style="font-weight:bold">Im Versuch</text><text class="ts" x="365" y="540" style="font-weight:bold">In StoSiS</text>
<line x1="28" y1="546" x2="665" y2="546" stroke="#D3D1C7" stroke-width="0.8"/>
<rect x="28" y="553" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="t" x="45" y="562" style="font-size:12.5px">Trichter und Doppelschnecke liefern das Pulver</text><text class="t" x="365" y="562" style="font-size:12.5px">Inlet „Dosierer“, 100 kg/h konstant</text>
<rect x="28" y="572" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="t" x="45" y="581" style="font-size:12.5px">Regler hält das Mittel (gemessen 69,45 kg/h)</text><text class="t" x="365" y="581" style="font-size:12.5px">Anteil μ = 0,6944 von 100 kg/h (angepasst)</text>
<rect x="28" y="591" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="t" x="45" y="600" style="font-size:12.5px">Restschwankung (Schnecken, Rührer, Pulver)</text><text class="t" x="365" y="600" style="font-size:12.5px">OU-Schwankung: σ = 0,81 kg/h, τ = 0,3 s</text>
<rect x="28" y="610" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text class="t" x="45" y="619" style="font-size:12.5px">Auffangwaage: Gewicht alle 0,1 s, &gt; 30 min</text><text class="t" x="365" y="619" style="font-size:12.5px">Outlet „Auffangwaage“, dt = 0,1 s, 30 min</text>
<rect x="28" y="629" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text class="t" x="45" y="638" style="font-size:12.5px">PC: 1-s-Werte, Filter ±10 % und ±3σ, RSD</text><text class="t" x="365" y="638" style="font-size:12.5px">dieselbe Auswertung im Programm</text>
<rect x="28" y="648" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text class="t" x="45" y="657" style="font-size:12.5px">–</text><text class="t" x="365" y="657" style="font-size:12.5px">Outlet „Rest“: nur für die Massenbilanz</text>
<rect x="28" y="667" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text class="t" x="45" y="676" style="font-size:12.5px">Regelkreis, Nachfüllen, Eimerwechsel, Spektrum</text><text class="t" x="365" y="676" style="font-size:12.5px">nicht nachgebildet (Regler steckt im Mittel μ)</text>
</svg>
