<svg xmlns="http://www.w3.org/2000/svg" width="680" height="315" viewBox="0 0 680 315">
<title>Stochastischer Splitter im Partikelmodus</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="24">Stochastischer Splitter im Partikelmodus: das Was und das Wie</text>
<text class="ts" x="70" y="50" text-anchor="end" dominant-baseline="central">0,4</text>
<text class="ts" x="70" y="95" text-anchor="end" dominant-baseline="central">0,3</text>
<text class="ts" x="70" y="140" text-anchor="end" dominant-baseline="central">0,2</text>
<line x1="80" y1="140" x2="600" y2="140" stroke="#888780" stroke-width="0.5"/>
<line x1="80" y1="50" x2="80" y2="140" stroke="#888780" stroke-width="0.5"/>
<line x1="80" y1="95" x2="600" y2="95" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="606" y="95" dominant-baseline="central">μ</text>
<polyline points="80.0,99.5 137.8,81.5 195.6,77.0 253.3,108.5 311.1,90.5 368.9,95.0 426.7,113.0 484.4,104.0 542.2,86.0 600.0,72.5" fill="none" stroke="#7F77DD" stroke-width="2"/>
<circle cx="195.6" cy="77" r="4.5" fill="#7F77DD"/><circle cx="253.3" cy="108.5" r="4.5" fill="#7F77DD"/><circle cx="311.1" cy="90.5" r="4.5" fill="#7F77DD"/>
<text class="ts" x="195.6" y="64" text-anchor="middle">0,34</text>
<text class="ts" x="253.3" y="126" text-anchor="middle">0,27</text>
<text class="ts" x="320" y="78" text-anchor="start">0,31</text>
<text class="ts" x="600" y="156" text-anchor="end">Zeitschritt</text>
<text class="t" x="40" y="182">Was: Der OU-Prozess legt in jedem Schritt den Anteil f(t) nach A fest – die echte Schwankung.</text>
<line x1="300" y1="192" x2="190" y2="214" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="192" x2="490" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="220" width="260" height="52" rx="6" stroke-width="0.5"/><text class="th" x="190" y="238" text-anchor="middle" dominant-baseline="central">Kontinuum</text><text class="ts" x="190" y="257" text-anchor="middle" dominant-baseline="central">jede Zahl der Verteilung × f(t)</text></g>
<g class="c-purple"><rect x="360" y="220" width="260" height="52" rx="6" stroke-width="0.5"/><text class="th" x="490" y="238" text-anchor="middle" dominant-baseline="central">Partikelmodus</text><text class="ts" x="490" y="257" text-anchor="middle" dominant-baseline="central">Karten so verteilen, dass A f(t) bekommt</text></g>
<text class="t" x="40" y="300">Wie: Das Verfahren setzt f(t) nur um und soll selbst keine Schwankung hinzufügen.</text>
</svg>
