<text x="255.6" y="72" text-anchor="end" style="font-size:12px;fill:#633806">je µm: Gipfel bei 11 µm, schief</text>
<text x="351.6" y="72" style="font-size:12px;fill:#3C3489">je Dekade: Gipfel bei 30 µm, symmetrisch</text>
<text class="t" x="20" y="300">Je Dekade (Vorschlag): Die Fläche auf dem Bildschirm entspricht der Masse. Je µm wirkt das Feine</text>
<text class="t" x="20" y="320">zu wichtig, weil ein µm links auf dem Bildschirm viel breiter ist als rechts.</text>
<text class="ts" x="20" y="344">Nur für die Anzeige: Höhe je Dekade = Fachinhalt / Fachbreite in Dekaden (bei 100 Klassen je Dekade: Fachinhalt · 100).</text>
