<text class="th" x="430" y="80">Größe des Keims d* = 2r*</text>
<text class="ts" x="430" y="104">Fall</text><text class="ts" x="600" y="104" text-anchor="end">d*</text><text class="ts" x="664" y="104" text-anchor="end">Moleküle</text>
<text class="t" x="430" y="126">Wasser, S = 2</text><text class="t" x="600" y="126" text-anchor="end">3,1 nm</text><text class="t" x="664" y="126" text-anchor="end">526</text>
<text class="t" x="430" y="148">Wasser, S = 4</text><text class="t" x="600" y="148" text-anchor="end">1,6 nm</text><text class="t" x="664" y="148" text-anchor="end">66</text>
<text class="t" x="430" y="170">Wasser, S = 10</text><text class="t" x="600" y="170" text-anchor="end">0,9 nm</text><text class="t" x="664" y="170" text-anchor="end">14</text>
<text class="t" x="430" y="192">Silber, S = 10⁶</text><text class="t" x="600" y="192" text-anchor="end">0,2–0,3 nm</text><text class="t" x="664" y="192" text-anchor="end">&lt; 1</text>
<text class="ts" x="430" y="218">Silber: Metalldampf bei 1500 K;</text><text class="ts" x="430" y="234">schon ein Atom (0,32 nm) ist stabil.</text>
<text class="t" x="20" y="340">r* = 2 γ v<tspan baseline-shift="sub" style="font-size:10px">m</tspan> / (k<tspan baseline-shift="sub" style="font-size:10px">B</tspan> T ln S) – Oberflächenspannung γ, Volumen eines Moleküls v<tspan baseline-shift="sub" style="font-size:10px">m</tspan>, Temperatur T, Übersättigung S.</text>
<text class="t" x="20" y="362">Keime liegen im Nanometerbereich – drei Dekaden unter einem Raster, das bei 1 µm beginnt.</text>
</svg>
