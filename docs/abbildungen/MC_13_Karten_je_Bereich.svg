<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470">
<title>Karten je Groessenbereich</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<view id="teil1" viewBox="0 0 680 356"/>
<view id="teil2" viewBox="0 356 680 114"/>
<text class="th" x="20" y="24">② Wie viele Karten bekommt welcher Größenbereich? (200 Karten je Schritt)</text>
<text class="ts" x="20" y="42">Sand, Log-Normal d50 = 100 µm, σ = 0,4. Bereiche mit Faktor 2 im Durchmesser.</text>
<text class="ts" x="208" y="66" text-anchor="middle">12.5–25 µm</text>
<text class="ts" x="208" y="84" text-anchor="middle">0,0 %</text><text class="ts" x="208" y="100" text-anchor="middle">1,2 %</text>
<text class="ts" x="290" y="66" text-anchor="middle">25–50 µm</text>
<text class="ts" x="290" y="84" text-anchor="middle">4,1 %</text><text class="ts" x="290" y="100" text-anchor="middle">28,5 %</text>
<text class="ts" x="372" y="66" text-anchor="middle">50–100 µm</text>
<text class="ts" x="372" y="84" text-anchor="middle">45,8 %</text><text class="ts" x="372" y="100" text-anchor="middle">58,8 %</text>
<text class="ts" x="454" y="66" text-anchor="middle">100–200 µm</text>
<text class="ts" x="454" y="84" text-anchor="middle">45,8 %</text><text class="ts" x="454" y="100" text-anchor="middle">11,3 %</text>
<text class="ts" x="536" y="66" text-anchor="middle">200–400 µm</text>
<text class="ts" x="536" y="84" text-anchor="middle">4,1 %</text><text class="ts" x="536" y="100" text-anchor="middle">0,2 %</text>
<text class="ts" x="618" y="66" text-anchor="middle">400–800 µm</text>
<text class="ts" x="618" y="84" text-anchor="middle">0,0 %</text><text class="ts" x="618" y="100" text-anchor="middle">0,0 %</text>
<text class="ts" x="160" y="84" text-anchor="end">Anteil an der Masse</text><text class="ts" x="160" y="100" text-anchor="end">Anteil an der Anzahl</text>
<text class="th" x="160" y="144" text-anchor="end">gleiche Masse</text>
<text class="ts" x="208" y="162.0" text-anchor="middle">0.1</text>
<g class="c-gray"><rect x="266" y="162.6" width="48" height="3.4" rx="2" stroke-width="0.5"/></g><text class="ts" x="290" y="158.6" text-anchor="middle">8</text>
<g class="c-gray"><rect x="348" y="127.8" width="48" height="38.2" rx="2" stroke-width="0.5"/></g><text class="ts" x="372" y="123.8" text-anchor="middle">92</text>
<g class="c-gray"><rect x="430" y="127.8" width="48" height="38.2" rx="2" stroke-width="0.5"/></g><text class="ts" x="454" y="123.8" text-anchor="middle">92</text>
<g class="c-gray"><rect x="512" y="162.6" width="48" height="3.4" rx="2" stroke-width="0.5"/></g><text class="ts" x="536" y="158.6" text-anchor="middle">8</text>
<text class="ts" x="618" y="162.0" text-anchor="middle">0.1</text>
<line x1="170" y1="166" x2="660" y2="166" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="660" y="180" text-anchor="end">Feines und Grobes nur 8 Karten</text>
<text class="th" x="160" y="226" text-anchor="end">gleiche Anzahl</text>
<g class="c-gray"><rect x="184" y="247.0" width="48" height="1.0" rx="2" stroke-width="0.5"/></g><text class="ts" x="208" y="243.0" text-anchor="middle">2</text>
<g class="c-gray"><rect x="266" y="224.2" width="48" height="23.8" rx="2" stroke-width="0.5"/></g><text class="ts" x="290" y="220.2" text-anchor="middle">57</text>
<g class="c-gray"><rect x="348" y="199.0" width="48" height="49.0" rx="2" stroke-width="0.5"/></g><text class="ts" x="372" y="195.0" text-anchor="middle">118</text>
<g class="c-gray"><rect x="430" y="238.6" width="48" height="9.4" rx="2" stroke-width="0.5"/></g><text class="ts" x="454" y="234.6" text-anchor="middle">23</text>
<text class="ts" x="536" y="243.9" text-anchor="middle">0.3</text>
<text class="ts" x="618" y="244.0" text-anchor="middle">0</text>
<line x1="170" y1="248" x2="660" y2="248" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="660" y="262" text-anchor="end">Grobes (4 % der Masse): 0,3 Karten</text>
<text class="th" x="160" y="308" text-anchor="end">Mittelweg</text>
<g class="c-purple"><rect x="184" y="325.8" width="48" height="4.2" rx="2" stroke-width="0.5"/></g><text class="ts" x="208" y="321.8" text-anchor="middle">10</text>
<g class="c-purple"><rect x="266" y="323.3" width="48" height="6.7" rx="2" stroke-width="0.5"/></g><text class="ts" x="290" y="319.3" text-anchor="middle">16</text>
<g class="c-purple"><rect x="348" y="297.2" width="48" height="32.8" rx="2" stroke-width="0.5"/></g><text class="ts" x="372" y="293.2" text-anchor="middle">79</text>
<g class="c-purple"><rect x="430" y="297.2" width="48" height="32.8" rx="2" stroke-width="0.5"/></g><text class="ts" x="454" y="293.2" text-anchor="middle">79</text>
<g class="c-purple"><rect x="512" y="323.3" width="48" height="6.7" rx="2" stroke-width="0.5"/></g><text class="ts" x="536" y="319.3" text-anchor="middle">16</text>
<text class="ts" x="618" y="326.0" text-anchor="middle">0</text>
<line x1="170" y1="330" x2="660" y2="330" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="660" y="344" text-anchor="end">mind. 10 je Bereich, Rest nach Masse</text>
<text class="th" x="20" y="374">③ Im Lauf: jeder Bereich bleibt zwischen Unter- und Obergrenze (z. B. 10 bis 80 Karten)</text>
<g class="c-teal"><rect x="20" y="388" width="310" height="74" rx="6" stroke-width="0.6"/></g>
<g class="c-amber"><rect x="350" y="388" width="310" height="74" rx="6" stroke-width="0.6"/></g>
<text class="th" x="34" y="408">Zu wenige: teilen</text><text class="ts" x="34" y="428">1 Karte mit Gewicht 1000 → 2 Karten mit je 500,</text><text class="ts" x="34" y="448">gleiche Größe und Zusammensetzung</text>
<text class="th" x="364" y="408">Zu viele: zusammenlegen</text><text class="ts" x="364" y="428">2 ähnliche Karten → 1 Karte, Gewichte addiert,</text><text class="ts" x="364" y="448">Größe massengewichtet gemittelt, nur gleiche Stoffe</text>
</svg>
