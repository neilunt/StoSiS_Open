<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476">
<title>Mindestzahl je Bereich</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="24">① Mindestzahl an Karten je Größenbereich: N<tspan baseline-shift="sub" style="font-size:10px">min</tspan> = ⌈f · N / B<tspan baseline-shift="sub" style="font-size:10px">belegt</tspan>⌉</text>
<text class="ts" x="20" y="42">Beispiel: N = 10 000 Karten, f = 20 %, Sand Log-Normal d50 = 100 µm, σ = 0,4; Bereiche mit Faktor 2 im Durchmesser</text>
<text class="th" x="20" y="72">1  Gesamtzahl aufteilen</text>
<g class="c-purple"><rect x="40.0" y="82" width="22.0" height="26" rx="3" stroke-width="0.5"/></g><g class="c-purple"><rect x="64.0" y="82" width="22.0" height="26" rx="3" stroke-width="0.5"/></g><g class="c-purple"><rect x="88.0" y="82" width="22.0" height="26" rx="3" stroke-width="0.5"/></g><g class="c-purple"><rect x="112.0" y="82" width="22.0" height="26" rx="3" stroke-width="0.5"/></g><g class="c-purple"><rect x="136.0" y="82" width="22.0" height="26" rx="3" stroke-width="0.5"/></g>
<g class="c-gray"><rect x="160" y="82" width="480" height="26" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="100" y="124" text-anchor="middle">f = 20 % = 2000 Karten reserviert,</text><text class="ts" x="100" y="139" text-anchor="middle">gleich auf 5 belegte Bereiche</text>
<text class="ts" x="400" y="124" text-anchor="middle">80 % = 8000 Karten nach Masse verteilt</text>
<text class="th" x="20" y="168">2  Belegte Bereiche zählen (mindestens 0,1 % der Masse oder der Anzahl)</text>
<rect class="box" x="40" y="178" width="82" height="24" rx="3" stroke-width="0.5" stroke-dasharray="3 3"/><text class="ts" x="81" y="194" text-anchor="middle">6.25–12.5 µm</text>
<g class="c-teal"><rect x="126" y="178" width="82" height="24" rx="3" stroke-width="0.5"/></g><text class="ts" x="167" y="194" text-anchor="middle">12.5–25 µm</text>
<g class="c-teal"><rect x="212" y="178" width="82" height="24" rx="3" stroke-width="0.5"/></g><text class="ts" x="253" y="194" text-anchor="middle">25–50 µm</text>
<g class="c-teal"><rect x="298" y="178" width="82" height="24" rx="3" stroke-width="0.5"/></g><text class="ts" x="339" y="194" text-anchor="middle">50–100 µm</text>
<g class="c-teal"><rect x="384" y="178" width="82" height="24" rx="3" stroke-width="0.5"/></g><text class="ts" x="425" y="194" text-anchor="middle">100–200 µm</text>
<g class="c-teal"><rect x="470" y="178" width="82" height="24" rx="3" stroke-width="0.5"/></g><text class="ts" x="511" y="194" text-anchor="middle">200–400 µm</text>
<rect class="box" x="556" y="178" width="82" height="24" rx="3" stroke-width="0.5" stroke-dasharray="3 3"/><text class="ts" x="597" y="194" text-anchor="middle">400–800 µm</text>
<text class="ts" x="40" y="220">B<tspan baseline-shift="sub" style="font-size:9px">belegt</tspan> = 5 (gestrichelt: leer) → N<tspan baseline-shift="sub" style="font-size:9px">min</tspan> = ⌈0,2 · 10 000 / 5⌉ = 400 Karten je belegtem Bereich</text>
<text class="th" x="20" y="250">3  Sollzahl je Bereich = Mindestzahl + Anteil nach Masse</text>
<g class="c-purple"><rect x="143" y="378.6" width="48" height="11.4" stroke-width="0.5"/></g><text class="ts" x="167" y="373.5" text-anchor="middle">402</text>
<g class="c-purple"><rect x="229" y="378.6" width="48" height="11.4" stroke-width="0.5"/></g><g class="c-gray"><rect x="229" y="369.1" width="48" height="9.5" stroke-width="0.5"/></g><text class="ts" x="253" y="364.1" text-anchor="middle">730</text>
<g class="c-purple"><rect x="315" y="378.6" width="48" height="11.4" stroke-width="0.5"/></g><g class="c-gray"><rect x="315" y="273.8" width="48" height="104.8" stroke-width="0.5"/></g><text class="ts" x="339" y="268.8" text-anchor="middle">4068</text>
<g class="c-purple"><rect x="401" y="378.6" width="48" height="11.4" stroke-width="0.5"/></g><g class="c-gray"><rect x="401" y="273.8" width="48" height="104.8" stroke-width="0.5"/></g><text class="ts" x="425" y="268.8" text-anchor="middle">4068</text>
<g class="c-purple"><rect x="487" y="378.6" width="48" height="11.4" stroke-width="0.5"/></g><g class="c-gray"><rect x="487" y="369.1" width="48" height="9.5" stroke-width="0.5"/></g><text class="ts" x="511" y="364.1" text-anchor="middle">730</text>
<line x1="40" y1="390" x2="640" y2="390" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="640" y="300" text-anchor="end">lila: Mindestzahl 400</text><text class="ts" x="640" y="316" text-anchor="end">grau: nach Masse</text>
<text class="th" x="20" y="420">4  Im Lauf</text>
<text class="t" x="40" y="442">unter N<tspan baseline-shift="sub" style="font-size:10px">min</tspan> → Karten teilen · deutlich über der Sollzahl (z. B. doppelt) → ähnliche Karten zusammenlegen</text>
<text class="t" x="40" y="462">N<tspan baseline-shift="sub" style="font-size:10px">min</tspan> unter etwa 10 → Warnung: zu wenige Karten für so viele Bereiche (Unsicherheit ≈ 1/√n)</text>
</svg>
