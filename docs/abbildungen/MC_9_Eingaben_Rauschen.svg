<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500">
<title>Von den Eingaben zum Rauschen</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="24">① Von den Eingaben zum Rauschen</text>
<g class="c-amber"><rect x="36" y="40" width="116" height="52" rx="6" stroke-width="0.5"/><text class="th" x="94" y="58" text-anchor="middle" dominant-baseline="central">Inlet</text><text class="ts" x="94" y="77" text-anchor="middle" dominant-baseline="central">T, p</text></g>
<g class="c-gray"><rect x="158" y="40" width="116" height="52" rx="6" stroke-width="0.5"/><text class="th" x="216" y="58" text-anchor="middle" dominant-baseline="central">Materialdatei</text><text class="ts" x="216" y="77" text-anchor="middle" dominant-baseline="central">M, μ(T), ρp</text></g>
<g class="c-amber"><rect x="280" y="40" width="116" height="52" rx="6" stroke-width="0.5"/><text class="th" x="338" y="58" text-anchor="middle" dominant-baseline="central">Zulauf</text><text class="ts" x="338" y="77" text-anchor="middle" dominant-baseline="central">ṁ, q3(d)</text></g>
<g class="c-amber"><rect x="402" y="40" width="116" height="52" rx="6" stroke-width="0.5"/><text class="th" x="460" y="58" text-anchor="middle" dominant-baseline="central">Apparat</text><text class="ts" x="460" y="77" text-anchor="middle" dominant-baseline="central">V, τV, G/ε, α</text></g>
<g class="c-amber"><rect x="524" y="40" width="116" height="52" rx="6" stroke-width="0.5"/><text class="th" x="582" y="58" text-anchor="middle" dominant-baseline="central">Simulation</text><text class="ts" x="582" y="77" text-anchor="middle" dominant-baseline="central">Kartenzahl NMC</text></g>
<line x1="340" y1="96" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="36" y="130" width="188" height="52" rx="6" stroke-width="0.5"/><text class="th" x="130" y="148" text-anchor="middle" dominant-baseline="central">Gas</text><text class="ts" x="130" y="167" text-anchor="middle" dominant-baseline="central">μ, ρg = pM/(RT), λ, ν</text></g>
<g class="c-purple"><rect x="236" y="130" width="188" height="52" rx="6" stroke-width="0.5"/><text class="th" x="330" y="148" text-anchor="middle" dominant-baseline="central">Hold-up</text><text class="ts" x="330" y="167" text-anchor="middle" dominant-baseline="central">M = ṁ·τV, c(d) = Anzahl/V</text></g>
<g class="c-purple"><rect x="436" y="130" width="188" height="52" rx="6" stroke-width="0.5"/><text class="th" x="530" y="148" text-anchor="middle" dominant-baseline="central">Gewichte</text><text class="ts" x="530" y="167" text-anchor="middle" dominant-baseline="central">w je Karte, Lupe sF = wmin</text></g>
<line x1="340" y1="186" x2="340" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="140" y="220" width="400" height="52" rx="6" stroke-width="0.5"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Kernel β(di, dj) × α</text><text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">Brownsch · Scherung · turbulent</text></g>
<line x1="340" y1="276" x2="340" y2="304" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="36" y="310" width="290" height="52" rx="6" stroke-width="0.5"/><text class="th" x="181" y="328" text-anchor="middle" dominant-baseline="central">Erwartete Stöße im Schritt</text><text class="ts" x="181" y="347" text-anchor="middle" dominant-baseline="central">ΔN = β · ci · cj · V · Δt</text></g>
<g class="c-purple"><rect x="346" y="310" width="290" height="52" rx="6" stroke-width="0.5"/><text class="th" x="491" y="328" text-anchor="middle" dominant-baseline="central">Koagulierter Anteil je Verweilzeit</text><text class="ts" x="491" y="347" text-anchor="middle" dominant-baseline="central">P ≈ 1 − exp(−β · c · τV)</text></g>
<line x1="340" y1="366" x2="340" y2="394" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="140" y="400" width="400" height="52" rx="6" stroke-width="0.5"/><text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">Rauschen</text><text class="ts" x="340" y="437" text-anchor="middle" dominant-baseline="central">je Schritt ≈ √(sF/ΔN) · je Verweilzeit ≈ 1/√(Ng·Pg)</text></g>
<g class="c-amber"><rect x="40" y="474" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="60" y="485">vorgegeben oder gemessen</text>
<g class="c-gray"><rect x="210" y="474" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="230" y="485">Stoffwert (Materialdatei)</text>
<g class="c-purple"><rect x="390" y="474" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="410" y="485">berechnet</text>
<g class="c-teal"><rect x="500" y="474" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="520" y="485">Ergebnis</text>
</svg>
