<text class="tl" text-anchor="middle" x="150.0" y="122.0">Rohr (Pfropfen), 2 s je Durchgang</text>
<line x1="210.0" y1="100.0" x2="246.0" y2="100.0" stroke="#555555" stroke-width="1.4" marker-end="url(#mg)"/>
