<polyline points="250,100 250,150 56,150 56,106" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#mg)"/>
<text class="tn" text-anchor="middle" x="150.0" y="162.0">Rückführung R·v = 1,5 v</text>
<text class="tn" text-anchor="start" x="10.0" y="192.0">exakt: Pulse 0,4 · 0,6^(k−1) bei t = k · 2 s, Mittel (R+1) · 2 s = 5 s</text>
<text class="th2" text-anchor="start" x="350.0" y="38.0">② In StoSiS (Levenspiel_A3_Rohr_mit_Rueckfuehrung.json)</text>
