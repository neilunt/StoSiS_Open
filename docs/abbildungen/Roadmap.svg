<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550">
<title>Roadmap</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-red rect, rect.c-red { fill: #FCEBEB; stroke: #A32D2D; }
.c-red text { fill: #791F1F; }
.c-green rect, rect.c-green { fill: #EAF3DE; stroke: #3B6D11; }
.c-green text { fill: #27500A; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #085041; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text data-titel="1" x="20" y="22" style="font-family: Calibri, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #222222">① Roadmap</text>
<g transform="translate(0,30)">
<text class="th" x="120" y="30" text-anchor="middle">Erledigt</text>
<g class="c-green"><rect x="20" y="46" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="61" text-anchor="middle" dominant-baseline="central">Flowsheet-Editor</text><text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">Heatmap, Kurven, Units</text></g>
<g class="c-green"><rect x="20" y="98" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="113" text-anchor="middle" dominant-baseline="central">Makroschritte</text><text class="ts" x="120" y="130" text-anchor="middle" dominant-baseline="central">Rückführungen, Gauß-Seidel</text></g>
<g class="c-green"><rect x="20" y="150" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="165" text-anchor="middle" dominant-baseline="central">Stochastik</text><text class="ts" x="120" y="182" text-anchor="middle" dominant-baseline="central">OU-Splitter, Mehrfachläufe</text></g>
<g class="c-green"><rect x="20" y="202" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="217" text-anchor="middle" dominant-baseline="central">Materialien 1–3</text><text class="ts" x="120" y="234" text-anchor="middle" dominant-baseline="central">Datei, Anzeige, Stoff/T/p</text></g>
<g class="c-green"><rect x="20" y="254" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="269" text-anchor="middle" dominant-baseline="central">Automatische Tests</text><text class="ts" x="120" y="286" text-anchor="middle" dominant-baseline="central">CTest, Regression</text></g>
<g class="c-green"><rect x="20" y="306" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="321" text-anchor="middle" dominant-baseline="central">MC-Konzept</text><text class="ts" x="120" y="338" text-anchor="middle" dominant-baseline="central">Festlegungen, Kap. 13</text></g>
<g class="c-green"><rect x="20" y="358" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="120" y="373" text-anchor="middle" dominant-baseline="central">Log. Größenraster</text><text class="ts" x="120" y="390" text-anchor="middle" dominant-baseline="central">SI, µm, Zoom, Start mit Rückführung</text></g>
<text class="th" x="340" y="30" text-anchor="middle">Als Nächstes</text>
<g class="c-amber"><rect x="240" y="46" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="340" y="61" text-anchor="middle" dominant-baseline="central">1  Offene MC-Fragen</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Gewichtung, Kartenzahl</text></g>
<g class="c-purple"><rect x="240" y="98" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="340" y="113" text-anchor="middle" dominant-baseline="central">2  Partikelmodus</text><text class="ts" x="340" y="130" text-anchor="middle" dominant-baseline="central">Karten, Quantile, Splitter</text></g>
<g class="c-purple"><rect x="240" y="150" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="340" y="165" text-anchor="middle" dominant-baseline="central">3  Koagulator</text><text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central">Totalkoagulation, Kernels</text></g>
<g class="c-purple"><rect x="240" y="202" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="340" y="217" text-anchor="middle" dominant-baseline="central">4  Validierung</text><text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">Analytik, Kontinuum vs. MC</text></g>
<g class="c-purple"><rect x="240" y="254" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="340" y="269" text-anchor="middle" dominant-baseline="central">5  Bruch, Wachstum</text><text class="ts" x="340" y="286" text-anchor="middle" dominant-baseline="central">dann Keimbildung</text></g>
<text class="th" x="560" y="30" text-anchor="middle">Später</text>
<g class="c-gray"><rect x="460" y="46" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="61" text-anchor="middle" dominant-baseline="central">Parallele Läufe</text><text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">CPU-Threads, dann GPU</text></g>
<g class="c-gray"><rect x="460" y="98" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="113" text-anchor="middle" dominant-baseline="central">Speichern/Laden</text><text class="ts" x="560" y="130" text-anchor="middle" dominant-baseline="central">JSON, Dyssol-.dflw-Import</text></g>
<g class="c-gray"><rect x="460" y="150" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="165" text-anchor="middle" dominant-baseline="central">Materialien 4</text><text class="ts" x="560" y="182" text-anchor="middle" dominant-baseline="central">Bearbeiten, .dmdb-Export</text></g>
<g class="c-gray"><rect x="460" y="202" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="217" text-anchor="middle" dominant-baseline="central">Stoffwerte prüfen</text><text class="ts" x="560" y="234" text-anchor="middle" dominant-baseline="central">Trägergas, Porosität</text></g>
<g class="c-gray"><rect x="460" y="254" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="269" text-anchor="middle" dominant-baseline="central">3D-Heatmap</text><text class="ts" x="560" y="286" text-anchor="middle" dominant-baseline="central">Qt Graphs</text></g>
<g class="c-gray"><rect x="460" y="306" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="321" text-anchor="middle" dominant-baseline="central">Sieb, Crusher</text><text class="ts" x="560" y="338" text-anchor="middle" dominant-baseline="central">Trennkurve, Bruchmodelle</text></g>
<g class="c-gray"><rect x="460" y="358" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="373" text-anchor="middle" dominant-baseline="central">Transportmodelle</text><text class="ts" x="560" y="390" text-anchor="middle" dominant-baseline="central">Tanks-in-Series, Markov</text></g>
<g class="c-gray"><rect x="460" y="410" width="200" height="44" rx="6" stroke-width="0.5"/><text class="th" x="560" y="425" text-anchor="middle" dominant-baseline="central">Agglomeratstruktur</text><text class="ts" x="560" y="442" text-anchor="middle" dominant-baseline="central">Nebenstrecke</text></g>
<line x1="222" y1="68" x2="236" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="442" y1="68" x2="456" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="20" y="470" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" x="40" y="481">nächster Schritt</text>
<text class="ts" x="20" y="504">Materialien und Größenraster sind fertig. Die Schritte 1 bis 4 bereiten den Koagulator vor.</text>
</g>
</svg>
