<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320">
<title>Agglomerat aus Sand und Kohle in beiden Darstellungen</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle class="c-amber" cx="230" cy="48" r="20" stroke-width="0.5"/>
<text class="t" x="280" y="48" text-anchor="middle" dominant-baseline="central">+</text>
<circle class="c-gray" cx="330" cy="48" r="20" stroke-width="0.5"/>
<line x1="362" y1="48" x2="422" y2="48" class="arr" marker-end="url(#arrow)"/>
<circle class="c-amber" cx="448" cy="48" r="16" stroke-width="0.5"/>
<circle class="c-gray" cx="476" cy="48" r="16" stroke-width="0.5"/>
<text class="ts" x="230" y="88" text-anchor="middle">Sand 100 µm</text>
<text class="ts" x="330" y="88" text-anchor="middle">Kohle 100 µm</text>
<text class="ts" x="462" y="88" text-anchor="middle">Agglomerat 126 µm</text>
<line x1="440" y1="98" x2="200" y2="124" class="arr" marker-end="url(#arrow)"/>
<line x1="484" y1="98" x2="500" y2="124" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="128" width="280" height="172" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="152" text-anchor="middle">Setzkasten (heute)</text>
<g class="c-amber"><rect x="60" y="168" width="240" height="34" rx="4" stroke-width="0.5"/>
<text class="t" x="180" y="185" text-anchor="middle" dominant-baseline="central">Sand-Fach 126 µm: + m Sand</text></g>
<g class="c-gray"><rect x="60" y="210" width="240" height="34" rx="4" stroke-width="0.5"/>
<text class="t" x="180" y="227" text-anchor="middle" dominant-baseline="central">Kohle-Fach 126 µm: + m Kohle</text></g>
<text class="ts" x="180" y="266" text-anchor="middle">sieht aus wie zwei lose Körner</text>
<text class="ts" x="180" y="284" text-anchor="middle">Zusammenhalt geht verloren</text>
<rect class="box" x="360" y="128" width="280" height="172" rx="12" stroke-width="0.5"/>
<text class="th" x="500" y="152" text-anchor="middle">Karteikarte (MC-Partikel)</text>
<rect x="380" y="168" width="240" height="76" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="500" y="188" text-anchor="middle" dominant-baseline="central">Partikel 17</text>
<text class="ts" x="500" y="208" text-anchor="middle" dominant-baseline="central">Sand: m Sand, Kohle: m Kohle</text>
<text class="ts" x="500" y="228" text-anchor="middle" dominant-baseline="central">vertritt 1 Million echte Partikel</text>
<text class="ts" x="500" y="266" text-anchor="middle">Zusammensetzung bleibt erhalten</text>
<text class="ts" x="500" y="284" text-anchor="middle">neue Eigenschaft = neue Zeile</text>
</svg>
