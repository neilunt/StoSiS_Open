<svg xmlns="http://www.w3.org/2000/svg" width="680" height="405" viewBox="0 0 680 405">
<title>Totalkoagulation und SWA im Vergleich</title>
<style>
text { font-family: Calibri, Arial, sans-serif; }
.t { font-size: 14px; fill: #222222; }
.ts { font-size: 12px; fill: #595959; }
.th { font-size: 14px; font-weight: bold; fill: #222222; }
.c-amber rect, .c-amber circle, rect.c-amber, circle.c-amber { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #633806; }
.c-gray rect, .c-gray circle, rect.c-gray, circle.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #444441; }
.box { fill: #F7F6F2; stroke: #B4B2A9; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="34" text-anchor="middle">Vorher: je 10 000 echte Körner</text>
<g class="c-amber"><rect x="230" y="50" width="100" height="52" rx="4" stroke-width="0.5"/><text class="th" x="280" y="69" text-anchor="middle" dominant-baseline="central">Sand</text><text class="ts" x="280" y="88" text-anchor="middle" dominant-baseline="central">w = 10 000</text></g>
<g class="c-gray"><rect x="350" y="50" width="100" height="52" rx="4" stroke-width="0.5"/><text class="th" x="400" y="69" text-anchor="middle" dominant-baseline="central">Kohle</text><text class="ts" x="400" y="88" text-anchor="middle" dominant-baseline="central">w = 10 000</text></g>
<line x1="320" y1="108" x2="140" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="108" x2="340" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="108" x2="540" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="120" y="172" text-anchor="middle">Totalkoagulation</text>
<text class="ts" x="120" y="190" text-anchor="middle">beide Karten verrechnet</text>
<text class="th" x="340" y="172" text-anchor="middle">SWA, Fall A</text>
<text class="ts" x="340" y="190" text-anchor="middle">Sandkarte umgeschrieben</text>
<text class="th" x="560" y="172" text-anchor="middle">SWA, Fall B</text>
<text class="ts" x="560" y="190" text-anchor="middle">Kohlekarte umgeschrieben</text>
<rect class="c-amber" x="35" y="204" width="40" height="50" stroke-width="0"/><rect class="c-gray" x="75" y="204" width="40" height="50" stroke-width="0"/><rect x="35" y="204" width="80" height="50" rx="4" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="75" y="222" text-anchor="middle" dominant-baseline="central">S+K</text><text class="ts" x="75" y="240" text-anchor="middle" dominant-baseline="central">5 000</text>
<rect class="c-amber" x="125" y="204" width="40" height="50" stroke-width="0"/><rect class="c-gray" x="165" y="204" width="40" height="50" stroke-width="0"/><rect x="125" y="204" width="80" height="50" rx="4" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="165" y="222" text-anchor="middle" dominant-baseline="central">S+K</text><text class="ts" x="165" y="240" text-anchor="middle" dominant-baseline="central">5 000</text>
<rect class="c-amber" x="255" y="204" width="40" height="50" stroke-width="0"/><rect class="c-gray" x="295" y="204" width="40" height="50" stroke-width="0"/><rect x="255" y="204" width="80" height="50" rx="4" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="295" y="222" text-anchor="middle" dominant-baseline="central">S+K</text><text class="ts" x="295" y="240" text-anchor="middle" dominant-baseline="central">5 000</text>
<g class="c-gray"><rect x="345" y="204" width="80" height="50" rx="4" stroke-width="0.5"/><text class="ts" x="385" y="222" text-anchor="middle" dominant-baseline="central">Kohle</text><text class="ts" x="385" y="240" text-anchor="middle" dominant-baseline="central">10 000</text></g>
<g class="c-amber"><rect x="475" y="204" width="80" height="50" rx="4" stroke-width="0.5"/><text class="ts" x="515" y="222" text-anchor="middle" dominant-baseline="central">Sand</text><text class="ts" x="515" y="240" text-anchor="middle" dominant-baseline="central">10 000</text></g>
<rect class="c-amber" x="565" y="204" width="40" height="50" stroke-width="0"/><rect class="c-gray" x="605" y="204" width="40" height="50" stroke-width="0"/><rect x="565" y="204" width="80" height="50" rx="4" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="605" y="222" text-anchor="middle" dominant-baseline="central">S+K</text><text class="ts" x="605" y="240" text-anchor="middle" dominant-baseline="central">5 000</text>
<text class="t" x="120" y="280" text-anchor="middle">Sand: 10 000 ✓</text>
<text class="t" x="120" y="298" text-anchor="middle">Kohle: 10 000 ✓</text>
<text class="ts" x="120" y="318" text-anchor="middle">10 000 Stöße auf einmal</text>
<text class="t" x="340" y="280" text-anchor="middle">Sand: 5 000 (− 5 000)</text>
<text class="t" x="340" y="298" text-anchor="middle">Kohle: 15 000 (+ 5 000)</text>
<text class="ts" x="340" y="318" text-anchor="middle">halb so groß, doppelt so oft</text>
<text class="t" x="560" y="280" text-anchor="middle">Sand: 15 000 (+ 5 000)</text>
<text class="t" x="560" y="298" text-anchor="middle">Kohle: 5 000 (− 5 000)</text>
<text class="ts" x="560" y="318" text-anchor="middle">gleich wahrscheinlich wie A</text>
<text class="ts" x="120" y="357" text-anchor="middle">stimmt bei jedem Ereignis</text>
<rect class="box" x="250" y="334" width="400" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="450" y="352" text-anchor="middle" dominant-baseline="central">Mittel aus A und B: Sand 10 000, Kohle 10 000</text>
<text class="ts" x="450" y="371" text-anchor="middle" dominant-baseline="central">Bilanz stimmt nur im Mittel</text>
</svg>
